# E2-SA: Sentence-aware segmentation, NO overlap
# Isolates the boundary effect only.
# Base: E2 (TCGA pretrain -> Baheya fine-tune), all other hyperparameters identical.
# Difference from E2: segmentation_mode: sentence_aware, overlap_tokens: 0

experiment_name: "E2_sa_no_overlap"

model:
  encoder_hf_id: "microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext"
  segment_size: 128
  max_segments: 20
  strict_length: false
  diagnostic_max_tokens: 512
  attention_hidden_dim: 256
  init_from_checkpoint: "checkpoints/Phase1_TCGA_pubmedbert/best.pt"
  init_load_attention: true
  init_load_heads: false
  segmentation_mode: "sentence_aware"
  overlap_tokens: 0

data:
  parquet: "data/frozen/m1_model_ready/m1_model_ready.parquet"
  label_vocab: "data/frozen/m1_model_ready/label_vocab.json"
  cv_folds: "data/frozen/m1_model_ready/cv_folds.csv"
  module: "M1"
  text_field: "text_section_tagged"
  trainable_value: "trainable"
  test_value: "test"
  val_value: null

train:
  epochs: 30
  micro_batch_size: 8
  grad_accumulation_steps: 4
  learning_rate: 3.0e-5
  warmup_ratio: 0.10
  weight_decay: 0.01
  max_grad_norm: 1.0
  loss: "bce"
  focal_gamma: 2.0
  early_stopping_patience: 5
  mixed_precision: "bf16"

cv:
  enabled: true
  n_folds: 5
  seed: 42

eval:
  rare_code_threshold: 10
  report_rare_separately: true

logging:
  project: "MCIS_AI"
  run_name: "E2_sa_no_overlap"
  output_dir: "results"
  checkpoint_dir: "checkpoints"
  wandb_enabled: true
