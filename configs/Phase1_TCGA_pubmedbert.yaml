# MCIS Phase 1 — TCGA non-BRCA pretrain (PubMedBERT anchor)
# Source: data/frozen/tcga_pretrain_model_ready/ (8453 rows, 34-col canonical
#   schema, vocab v3). Pre-baked 3-way split:
#     pretrain_train=5926  pretrain_val=1268  pretrain_test=1259
# pretrain_test is held out here (optional encoder-transfer sanity later).
#
# Goal: supervise the encoder on TCGA gold ICD-O-3 (5 axes, no ICD-11 —
# TCGA ICD-11 is silver, never label; data card §7, arch v6 §6.4). Phase 2
# (E2) loads encoder+attention from this ckpt and resets heads for Baheya
# vocab (arch v6 §4.4; init_load_heads=false).
#
# No CV: single train/val run on the pre-baked splits (data.val_value path).

experiment_name: "Phase1_TCGA_pubmedbert"
seed: 42

data:
  parquet: "data/frozen/tcga_pretrain_model_ready/tcga_pretrain_model_ready.parquet"
  label_vocab: "data/frozen/tcga_pretrain_model_ready/label_vocab.json"
  cv_folds: ""                       # unused (cv.enabled=false)
  module: "TCGA_pretrain"            # → Trainer.set_phase("icdo3_only")
  text_field: "text_section_tagged"  # matches E1; Phase 1 stays section-tagged
  trainable_value: "pretrain_train"  # train split
  test_value: "pretrain_test"        # held out, not loaded
  val_value: "pretrain_val"          # explicit pre-baked val (no 90/10 slice)

# Frozen from label_vocab.json v3 (built from pretrain_train only).
# Verified on disk 2026-05-14: topo=118 morph=108 behav=3 grade=4 lat=3.
label_cardinalities:
  icdo3_topography: 118
  icdo3_morphology: 108
  icdo3_behavior:   3
  icdo3_grade:      4
  icdo3_laterality: 3
# No ICD-11 axes: silver in TCGA, never supervised (data card §5/§7).

axis_types:
  single_pick: [icdo3_topography, icdo3_morphology, icdo3_behavior,
                icdo3_grade, icdo3_laterality]
  multilabel:  []

aux_fields: []   # no aux histology heads in Phase 1

model:
  encoder_hf_id: "microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext"
  segment_size: 128
  max_segments: 20      # TCGA p95=19 segments (B0.yaml truncation audit)
  strict_length: false
  diagnostic_max_tokens: 512
  attention_hidden_dim: 256

  # Phase 1 trains from scratch (no upstream ckpt).
  init_from_checkpoint: null
  init_load_attention: true
  init_load_heads: false

  use_aux_histology_heads: false   # E3 off
  aux_loss_weight: 0.3
  icd11_two_stage: false           # E6 off

train:
  epochs: 20                  # Increased from 5 to prevent early cutoff
  micro_batch_size: 8
  grad_accumulation_steps: 4 # effective batch = 32
  learning_rate: 3.0e-5
  warmup_ratio: 0.10
  weight_decay: 0.01
  max_grad_norm: 1.0
  loss: "bce"                # default CE/BCE; no grid loss in Phase 1
  focal_gamma: 2.0
  early_stopping_patience: 5
  mixed_precision: "bf16"    # A100 default (Ampere+; no scaler bookkeeping)

cv:
  enabled: false             # single train/val on pre-baked splits
  n_folds: 5
  seed: 42

eval:
  rare_code_threshold: 10
  report_rare_separately: true
  subgroups: [batch, template_flag, is_cancer_primary]
  test_only_oov_excluded: true

logging:
  project: "MCIS_AI"
  run_name: null
  output_dir: "results"
  checkpoint_dir: "checkpoints"
  wandb_enabled: true
  wandb_mode: "online"
