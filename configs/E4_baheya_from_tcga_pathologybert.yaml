# MCIS E4 — Baheya M1 fine-tune, initialized from TCGA Phase 1 (PathologyBERT)
#
# This config tests michaelfarrell/PathologyBERT as an alternative backbone
# to PubMedBERT. It initializes from the Phase 1 PathologyBERT checkpoint.
# Everything else is identical to E2 (Baheya 10-axis, fixed segmentation, etc).

experiment_name: "E4_baheya_from_tcga_pathologybert"
seed: 42

data:
  parquet: "data/frozen/m1_model_ready/m1_model_ready.parquet"
  label_vocab: "data/frozen/m1_model_ready/label_vocab.json"
  cv_folds: "data/frozen/m1_model_ready/cv_folds.csv"
  module: "M1"                       # → Phase 2: all 10 axes active
  text_field: "text_section_tagged"
  trainable_value: "trainable"
  test_value: "test"
  val_value: null                    # CV path; pre-baked val not used here

label_cardinalities:
  icdo3_topography:     8
  icdo3_morphology:     24
  icdo3_behavior:       4
  icdo3_grade:          3
  icdo3_laterality:     3
  icd11_stem:           27
  icd11_ext_anatomy:    16
  icd11_ext_histopath:  23
  icd11_ext_laterality: 6
  icd11_ext_grading:    5

axis_types:
  single_pick: [icdo3_topography, icdo3_morphology, icdo3_behavior,
                icdo3_grade, icdo3_laterality, icd11_stem,
                icd11_ext_laterality, icd11_ext_grading]
  multilabel:  [icd11_ext_anatomy, icd11_ext_histopath]

aux_fields: [nuclear_grade, tubular_score, mitosis_score, lvi, dcis_in_specimen]

model:
  encoder_hf_id: "michaelfarrell/PathologyBERT"
  segment_size: 128
  max_segments: 20
  strict_length: false
  diagnostic_max_tokens: 512
  attention_hidden_dim: 256

  # ---- TCGA → Baheya transfer (PathologyBERT) ----
  init_from_checkpoint: "checkpoints/Phase1_TCGA_pathologybert/best.pt"
  init_load_attention: true     # transfer label-wise attention (shape-checked)
  init_load_heads: false        # RESET heads — fresh for Baheya 10-axis vocab

  use_aux_histology_heads: false
  aux_loss_weight: 0.3
  icd11_two_stage: false

train:
  epochs: 30
  micro_batch_size: 8
  grad_accumulation_steps: 4   # effective batch = 32
  learning_rate: 3.0e-5
  warmup_ratio: 0.10
  weight_decay: 0.01
  max_grad_norm: 1.0
  loss: "bce"
  focal_gamma: 2.0
  early_stopping_patience: 5
  mixed_precision: "bf16"

cv:
  enabled: true
  n_folds: 5
  seed: 42

eval:
  rare_code_threshold: 10
  report_rare_separately: true
  subgroups: [batch, template_flag, is_cancer_primary, nos_topography_derived]
  test_only_oov_excluded: true

logging:
  project: "MCIS_AI"
  run_name: null
  output_dir: "results"
  checkpoint_dir: "checkpoints"
  wandb_enabled: true
  wandb_mode: "online"
