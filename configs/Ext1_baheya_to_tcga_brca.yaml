# MCIS Ext-1 — Baheya-only checkpoint → TCGA-BRCA external validation
#
# Pure cross-institution generalization test: take the E1 checkpoint
# (Baheya-only, no TCGA pretrain) and evaluate on TCGA-BRCA test set.
# No training — inference only. A100, ~1 h.
#
# TEMPLATE: update init_from_checkpoint to E1's best checkpoint.

experiment_name: "Ext1_baheya_to_tcga_brca"
seed: 42

model:
  encoder_hf_id: "microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext"
  segment_size: 128
  max_segments: 20
  strict_length: false
  diagnostic_max_tokens: 512
  attention_hidden_dim: 256
  # TODO: update to E1 best checkpoint path
  init_from_checkpoint: "checkpoints/E1/best.pt"
  init_load_attention: true
  init_load_heads: true     # Same vocab → load heads directly
  use_aux_histology_heads: false
  aux_loss_weight: 0.3
  icd11_two_stage: false

data:
  # TODO: update to TCGA-BRCA parquet / vocab when available
  parquet: "data/frozen/tcga_brca_external_model_ready/tcga_brca_external_model_ready.parquet"
  label_vocab: "data/frozen/m1_model_ready/label_vocab.json"
  cv_folds: "data/frozen/m1_model_ready/cv_folds.csv"
  module: "M1"
  text_field: "text_section_tagged"
  trainable_value: "trainable"
  test_value: "test"
  val_value: null

label_cardinalities:
  icdo3_topography:     8
  icdo3_morphology:     24
  icdo3_behavior:       4
  icdo3_grade:          3
  icdo3_laterality:     3
  icd11_stem:           27
  icd11_ext_anatomy:    16
  icd11_ext_histopath:  23
  icd11_ext_laterality: 6
  icd11_ext_grading:    5

axis_types:
  single_pick: [icdo3_topography, icdo3_morphology, icdo3_behavior,
                icdo3_grade, icdo3_laterality, icd11_stem,
                icd11_ext_laterality, icd11_ext_grading]
  multilabel:  [icd11_ext_anatomy, icd11_ext_histopath]

train:
  epochs: 0        # Inference only — no training
  micro_batch_size: 8
  grad_accumulation_steps: 1
  learning_rate: 3.0e-5
  warmup_ratio: 0.10
  weight_decay: 0.01
  max_grad_norm: 1.0
  loss: "bce"
  focal_gamma: 2.0
  early_stopping_patience: 1
  mixed_precision: "bf16"

cv:
  enabled: false
  n_folds: 1
  seed: 42

eval:
  rare_code_threshold: 10
  report_rare_separately: true
  subgroups: [batch, template_flag, is_cancer_primary, nos_topography_derived]
  test_only_oov_excluded: true

logging:
  project: "MCIS_AI"
  run_name: "Ext1_baheya_to_tcga_brca"
  output_dir: "results"
  checkpoint_dir: "checkpoints"
  wandb_enabled: true
  wandb_mode: "online"
