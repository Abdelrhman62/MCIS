# MCIS MCIS-Best — Headline reproducibility run
#
# Best config from {E1, E2, E5a, E5b, E7} experiments.
# WINNER: E7 (Hierarchical Loss) scored 0.6746 ± 0.0061, beating E2 by +0.011.
#
# Run with 3 seeds × 5 folds to produce mean ± std headline numbers for the paper.
#
# RunPod Secure A100, ~12 h total (3 seeds × 5 folds × ~45 min each).

experiment_name: "MCIS_Best_E7"
seed: 42    # Override per seed: --seed 42 / --seed 123 / --seed 456

model:
  encoder_hf_id: "microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext"
  segment_size: 128
  max_segments: 20
  strict_length: false
  diagnostic_max_tokens: 512
  attention_hidden_dim: 256
  # Updated to winning Phase 1 25ep checkpoint (0.7002 val metric)
  init_from_checkpoint: "checkpoints/Phase1_TCGA_pubmedbert_25ep/best.pt"
  init_load_attention: true
  init_load_heads: false
  use_aux_histology_heads: false
  aux_loss_weight: 0.3
  icd11_two_stage: false
  
  # Enable hierarchical ontology-aware smoothing (E7 Winner)
  hierarchical_smoothing: 0.3

data:
  parquet: "data/frozen/m1_model_ready/m1_model_ready.parquet"
  label_vocab: "data/frozen/m1_model_ready/label_vocab.json"
  cv_folds: "data/frozen/m1_model_ready/cv_folds.csv"
  module: "M1"
  text_field: "text_section_tagged"
  trainable_value: "trainable"
  test_value: "test"
  val_value: null

label_cardinalities:
  icdo3_topography:     8
  icdo3_morphology:     24
  icdo3_behavior:       4
  icdo3_grade:          3
  icdo3_laterality:     3
  icd11_stem:           27
  icd11_ext_anatomy:    16
  icd11_ext_histopath:  23
  icd11_ext_laterality: 6
  icd11_ext_grading:    5

axis_types:
  single_pick: [icdo3_topography, icdo3_morphology, icdo3_behavior,
                icdo3_grade, icdo3_laterality, icd11_stem,
                icd11_ext_laterality, icd11_ext_grading]
  multilabel:  [icd11_ext_anatomy, icd11_ext_histopath]

train:
  epochs: 30
  micro_batch_size: 8
  grad_accumulation_steps: 4
  learning_rate: 3.0e-5
  warmup_ratio: 0.10
  weight_decay: 0.01
  max_grad_norm: 1.0
  loss: "hierarchical"
  focal_gamma: 0.0
  early_stopping_patience: 5
  mixed_precision: "bf16"

cv:
  enabled: true
  n_folds: 5
  seed: 42

eval:
  rare_code_threshold: 10
  report_rare_separately: true
  subgroups: [batch, template_flag, is_cancer_primary, nos_topography_derived]
  test_only_oov_excluded: true

logging:
  project: "MCIS_AI"
  run_name: "MCIS_Best"
  output_dir: "results"
  checkpoint_dir: "checkpoints"
  wandb_enabled: true
  wandb_mode: "online"
