# MCIS Grid A1 — class-weighted CE on E1 base, single fold
# Per architecture v6 §4.2 / build plan: grid pass is single-fold each on
# E1 anchor. Run all 5 grid cells, compare to E1 fold-0 baseline, lock
# best loss config before stacking on E2 (E5a).
#
# Loss: inverse-frequency class weights, clipped at 10×.
# - Single-pick: F.cross_entropy(weight=w) where w_c = n / (K*(count_c + 1)).
# - Multi-label: BCE with pos_weight_c = (n - n_pos_c) / (n_pos_c + 1).
#
# Compared to B1's sklearn class_weight='balanced':
#   sklearn uses n_samples / (n_classes * np.bincount(y))  — no smoothing.
#   We add +1 Laplace smoothing to handle zero-count classes safely.
# The clip at 10× prevents ultra-rare classes (1-2 examples) from dominating
# gradients.

experiment_name: "Grid_A1_classweighted"
seed: 42

data:
  parquet: "data/frozen/m1_model_ready/m1_model_ready.parquet"
  label_vocab: "data/frozen/m1_model_ready/label_vocab.json"
  cv_folds: "data/frozen/m1_model_ready/cv_folds.csv"
  module: "M1"
  text_field: "text_section_tagged"
  trainable_value: "trainable"
  test_value: "test"

label_cardinalities:
  icdo3_topography:     8
  icdo3_morphology:     24
  icdo3_behavior:       4
  icdo3_grade:          3
  icdo3_laterality:     3
  icd11_stem:           27
  icd11_ext_anatomy:    16
  icd11_ext_histopath:  23
  icd11_ext_laterality: 6
  icd11_ext_grading:    5

axis_types:
  single_pick: [icdo3_topography, icdo3_morphology, icdo3_behavior,
                icdo3_grade, icdo3_laterality, icd11_stem,
                icd11_ext_laterality, icd11_ext_grading]
  multilabel:  [icd11_ext_anatomy, icd11_ext_histopath]

aux_fields: [nuclear_grade, tubular_score, mitosis_score, lvi, dcis_in_specimen]

model:
  encoder_hf_id: "microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext"
  segment_size: 128
  max_segments: 20
  strict_length: false
  diagnostic_max_tokens: 512
  attention_hidden_dim: 256
  init_from_checkpoint: null
  init_load_attention: true
  init_load_heads: false
  use_aux_histology_heads: false
  aux_loss_weight: 0.3
  icd11_two_stage: false

train:
  epochs: 10
  micro_batch_size: 8
  grad_accumulation_steps: 4
  learning_rate: 3.0e-5
  warmup_ratio: 0.10
  weight_decay: 0.01
  max_grad_norm: 1.0
  loss: "class_weighted"        # <-- the only diff vs E1/B0
  focal_gamma: 2.0              # unused for class_weighted, kept for cfg-parse compat
  early_stopping_patience: 3
  mixed_precision: "bf16"       # A100 default

cv:
  enabled: true
  n_folds: 5
  seed: 42

eval:
  rare_code_threshold: 10
  report_rare_separately: true
  subgroups: [batch, template_flag, is_cancer_primary, nos_topography_derived]
  test_only_oov_excluded: true

logging:
  project: "MCIS_AI"
  run_name: null
  output_dir: "results"
  checkpoint_dir: "checkpoints"
  wandb_enabled: true
  wandb_mode: "online"
