# MCIS E1 — OCE Baheya-only baseline (no pretraining)
#
# Pure Baheya baseline: OCE with multi-task heads trained from scratch
# on Baheya M1 data. No Phase 1 TCGA pretraining. This is the anchor
# for measuring what TCGA pretrain (E2) adds.
#
# Checkpoint from this run feeds Ext-1 (cross-institution generalization).
# A100 training settings: bf16, 30 epochs, patience 5.

experiment_name: "E1"
seed: 42

model:
  encoder_hf_id: "microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext"
  segment_size: 128
  max_segments: 20
  strict_length: false
  diagnostic_max_tokens: 512
  attention_hidden_dim: 256
  init_from_checkpoint: null    # No pretraining — train from scratch
  init_load_attention: true
  init_load_heads: false
  use_aux_histology_heads: false
  aux_loss_weight: 0.3
  icd11_two_stage: false

data:
  parquet: "data/frozen/m1_model_ready/m1_model_ready.parquet"
  label_vocab: "data/frozen/m1_model_ready/label_vocab.json"
  cv_folds: "data/frozen/m1_model_ready/cv_folds.csv"
  module: "M1"
  text_field: "text_section_tagged"
  trainable_value: "trainable"
  test_value: "test"
  val_value: null

label_cardinalities:
  icdo3_topography:     8
  icdo3_morphology:     24
  icdo3_behavior:       4
  icdo3_grade:          3
  icdo3_laterality:     3
  icd11_stem:           27
  icd11_ext_anatomy:    16
  icd11_ext_histopath:  23
  icd11_ext_laterality: 6
  icd11_ext_grading:    5

axis_types:
  single_pick: [icdo3_topography, icdo3_morphology, icdo3_behavior,
                icdo3_grade, icdo3_laterality, icd11_stem,
                icd11_ext_laterality, icd11_ext_grading]
  multilabel:  [icd11_ext_anatomy, icd11_ext_histopath]

train:
  epochs: 30
  micro_batch_size: 8
  grad_accumulation_steps: 4
  learning_rate: 3.0e-5
  warmup_ratio: 0.10
  weight_decay: 0.01
  max_grad_norm: 1.0
  loss: "bce"
  focal_gamma: 2.0
  early_stopping_patience: 5
  mixed_precision: "bf16"

cv:
  enabled: true
  n_folds: 5
  seed: 42

eval:
  rare_code_threshold: 10
  report_rare_separately: true
  subgroups: [batch, template_flag, is_cancer_primary, nos_topography_derived]
  test_only_oov_excluded: true

logging:
  project: "MCIS_AI"
  run_name: "E1"
  output_dir: "results"
  checkpoint_dir: "checkpoints"
  wandb_enabled: true
  wandb_mode: "online"
